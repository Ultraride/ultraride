<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UltraRide — Le répertoire des ultra</title>
  <meta name="color-scheme" content="light dark" />
  <script>
    // Thème mémorisé appliqué avant le rendu, pour éviter un flash.
    try {
      var t = localStorage.getItem("ultraride_theme");
      if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  </script>
  <meta name="description" content="Toutes les courses et aventures ultra-distance à vélo en France et en Europe." />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
