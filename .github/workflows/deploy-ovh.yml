name: Deploy to OVH

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Un seul déploiement à la fois : un push rapproché attend la fin du précédent.
concurrency:
  group: deploy-ovh
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Filet de sécurité : un envoi bloqué ne monopolise pas le runner.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # Le mutualisé OVH refuse le FTPS : envoi en SFTP (port 22).
      # Le mot de passe passe par LFTP_PASSWORD (--env-password), jamais par
      # la ligne de commande. Sans --delete : rien n'est supprimé côté serveur.
      - name: Upload dist/ over SFTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "
            set cmd:fail-exit yes;
            set sftp:auto-confirm yes;
            set net:max-retries 2;
            set net:timeout 30;
            set net:reconnect-interval-base 5;
            open --env-password -u '$FTP_USERNAME' -p 22 'sftp://$FTP_SERVER';
            mirror --reverse --verbose --parallel=4 ./dist/ www/;
            bye
          "
